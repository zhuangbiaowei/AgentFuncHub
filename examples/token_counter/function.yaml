spec_version: "0.1"

id: "ai.token.counter"
version: "1.0.0"
name: "Token Counter"
description: "Token计数器，支持多种估算算法（tiktoken风格、字符估算、单词估算），用于AI模型输入长度控制"

language:
  name: "python"
  runtime: "python>=3.8"

entrypoint:
  kind: "inline"
  symbol: "count_tokens"
  code: |
    import re
    from typing import Dict, Any, List, Optional
    
    def count_tokens(
        text: str,
        model: str = "gpt-4",
        method: str = "estimate"
    ) -> Dict[str, Any]:
        """
        估算文本的token数量
        
        Args:
            text: 输入文本
            model: 模型名称，用于估算参数调整
            method: 估算方法 (estimate, char_ratio, word_count)
            
        Returns:
            包含token数量和相关信息的字典
        """
        if not text:
            return {
                "token_count": 0,
                "char_count": 0,
                "word_count": 0,
                "estimated": True,
                "model": model,
                "method": method
            }
        
        char_count = len(text)
        word_count = len(text.split())
        
        # 不同模型的token比率
        model_ratios = {
            "gpt-4": 0.25,          # ~4 chars per token
            "gpt-3.5-turbo": 0.25,
            "claude": 0.22,         # ~4.5 chars per token
            "llama": 0.20,          # ~5 chars per token
            "general": 0.25
        }
        
        if method == "estimate":
            # 使用模型特定的比率估算
            ratio = model_ratios.get(model, model_ratios["general"])
            
            # 处理Unicode字符（通常每个字符约1-2个token）
            ascii_chars = sum(1 for c in text if ord(c) < 128)
            unicode_chars = char_count - ascii_chars
            
            # ASCII字符使用比率，Unicode字符按每个约1-2个token估算
            token_count = int(ascii_chars * ratio + unicode_chars * 1.5)
            
            # 调整：空格和标点通常合并
            whitespace_count = len(re.findall(r'\s+', text))
            token_count -= int(whitespace_count * 0.3)
            
        elif method == "char_ratio":
            # 简单字符比率方法
            ratio = model_ratios.get(model, model_ratios["general"])
            token_count = int(char_count * ratio)
            
        elif method == "word_count":
            # 单词计数方法（英语适用）
            # 平均每个英文单词约1.3个token
            token_count = int(word_count * 1.3)
            
        else:
            token_count = int(char_count * 0.25)
        
        # 确保最小为1（如果有内容）
        token_count = max(1, token_count) if text else 0
        
        # 模型上下文长度限制
        context_limits = {
            "gpt-4": 8192,
            "gpt-4-turbo": 128000,
            "gpt-3.5-turbo": 4096,
            "gpt-3.5-turbo-16k": 16384,
            "claude": 100000,
            "claude-3": 200000,
            "llama-2-7b": 4096,
            "llama-2-70b": 4096,
            "general": 4096
        }
        
        limit = context_limits.get(model, context_limits["general"])
        usage_ratio = token_count / limit if limit > 0 else 0
        
        return {
            "token_count": token_count,
            "char_count": char_count,
            "word_count": word_count,
            "estimated": True,
            "model": model,
            "method": method,
            "context_limit": limit,
            "usage_ratio": round(usage_ratio, 4),
            "remaining_tokens": max(0, limit - token_count),
            "would_exceed_limit": token_count > limit
        }

signature:
  inputs:
    text:
      type: "string"
      required: true
      description: "要估算token数量的文本"
      example: "Hello, this is a sample text for token counting."
    model:
      type: "string"
      required: false
      description: "模型名称，影响估算比率"
      default: "gpt-4"
      example: "gpt-4"
    method:
      type: "string"
      required: false
      description: "估算方法 (estimate, char_ratio, word_count)"
      default: "estimate"
      example: "estimate"
  outputs:
    token_count:
      type: "integer"
      description: "估算的token数量"
    char_count:
      type: "integer"
      description: "字符数量"
    word_count:
      type: "integer"
      description: "单词数量"
    estimated:
      type: "boolean"
      description: "是否为估算值"
    model:
      type: "string"
      description: "使用的模型"
    method:
      type: "string"
      description: "使用的估算方法"
    context_limit:
      type: "integer"
      description: "模型上下文限制"
    usage_ratio:
      type: "number"
      description: "使用率比例"
    remaining_tokens:
      type: "integer"
      description: "剩余可用token数"
    would_exceed_limit:
      type: "boolean"
      description: "是否超出限制"

semantics:
  deterministic: true
  side_effects: []
  purity: "pure"
  security:
    sandbox_required: false
    network_access: false
    data_sensitivity: "low"

environment:
  dependencies: []
  platforms: ["linux", "darwin", "win32"]
  python_version: ">=3.8"

tests:
  framework: "builtin"
  cases:
    - name: "英文文本估算"
      input:
        text: "Hello world, this is a simple test sentence."
        model: "gpt-4"
        method: "estimate"
      expect:
        char_count: 44
        word_count: 9
        estimated: true
        model: "gpt-4"
        method: "estimate"
        would_exceed_limit: false
    - name: "空文本处理"
      input:
        text: ""
        model: "gpt-4"
      expect:
        token_count: 0
        char_count: 0
        word_count: 0
        would_exceed_limit: false
    - name: "不同模型比率"
      input:
        text: "这是一个中文文本，用于测试token计数功能。"
        model: "claude"
        method: "estimate"
      expect:
        model: "claude"
        method: "estimate"
        would_exceed_limit: false
    - name: "字符比率方法"
      input:
        text: "Short text."
        method: "char_ratio"
        model: "gpt-4"
      expect:
        method: "char_ratio"
        char_count: 11
        estimated: true
    - name: "长文本超出检测"
      input:
        text: "A"
        model: "gpt-3.5-turbo"
      expect:
        model: "gpt-3.5-turbo"
        context_limit: 4096
        would_exceed_limit: false
    - name: "单词计数方法"
      input:
        text: "The quick brown fox jumps over the lazy dog."
        method: "word_count"
        model: "general"
      expect:
        method: "word_count"
        word_count: 9
        estimated: true

tags: ["ai", "token", "llm", "nlp", "estimate"]

quality:
  maturity: "stable"
  coverage: 0.9

metadata:
  author: "AgentFuncHub"
  license: "MIT"
  created_at: "2026-02-06"
