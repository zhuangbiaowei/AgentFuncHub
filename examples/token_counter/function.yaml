spec_version: "0.1"

id: "ai.token_counter"
version: "1.0.0"
name: "Token Counter"
description: "估算文本的 Token 数量，支持中英文混合文本。使用简单估算算法：英文≈4字符/Token，中文≈1字符/Token。"

license: "MIT"
authors:
  - name: "AIUtilsAgent_1.0"
    contact: "agent@example.com"

language:
  name: "python"
  runtime: "python>=3.8"

entrypoint:
  kind: "inline"
  symbol: "count_tokens"
  code: |
    import re
    from typing import Dict, Union
    
    def count_tokens(text: str, algorithm: str = "simple") -> Dict[str, Union[int, float, str]]:
        """
        估算文本的 Token 数量。
        
        Args:
            text: 输入文本
            algorithm: 估算算法 (simple/cl100k/gpt4)
        
        Returns:
            包含 token_count, char_count, algorithm 的字典
        """
        if not isinstance(text, str):
            raise ValueError("text must be a string")
        
        char_count = len(text)
        
        if algorithm == "simple":
            # 简单估算：中文≈1字符/Token，英文≈4字符/Token
            # 使用 Unicode 范围区分中英文
            chinese_chars = len(re.findall(r'[\u4e00-\u9fff]', text))
            other_chars = char_count - chinese_chars
            token_count = chinese_chars + (other_chars / 4)
        elif algorithm == "cl100k":
            # CL100K 编码估算（更准确的近似）
            # 英文单词≈1.3 tokens，中文字符≈1 token
            english_words = len(re.findall(r'[a-zA-Z]+', text))
            chinese_chars = len(re.findall(r'[\u4e00-\u9fff]', text))
            other_chars = char_count - english_words - chinese_chars
            token_count = english_words * 1.3 + chinese_chars + (other_chars / 4)
        elif algorithm == "gpt4":
            # GPT-4 估算
            chinese_chars = len(re.findall(r'[\u4e00-\u9fff]', text))
            english_words = len(re.findall(r'[a-zA-Z]+', text))
            numbers = len(re.findall(r'\d+', text))
            other_chars = char_count - chinese_chars - english_words - numbers
            token_count = chinese_chars + english_words * 1.3 + numbers * 0.5 + (other_chars / 4)
        else:
            raise ValueError(f"Unknown algorithm: {algorithm}")
        
        return {
            "token_count": int(token_count),
            "estimated_count": round(token_count, 2),
            "char_count": char_count,
            "algorithm": algorithm
        }

signature:
  inputs:
    text:
      type: "string"
      required: true
      description: "需要估算 Token 数量的文本"
      example: "这是一个测试文本。This is a test."
    algorithm:
      type: "string"
      required: false
      default: "simple"
      description: "估算算法 (simple/cl100k/gpt4)"
      enum: ["simple", "cl100k", "gpt4"]
  outputs:
    token_count:
      type: "integer"
      description: "估算的 Token 数量（整数）"
    estimated_count:
      type: "float"
      description: "估算的 Token 数量（含小数）"
    char_count:
      type: "integer"
      description: "字符总数"
    algorithm:
      type: "string"
      description: "使用的估算算法"
  errors:
    - code: "E_INVALID_TEXT"
      description: "输入文本不是字符串"
    - code: "E_UNKNOWN_ALGORITHM"
      description: "未知的估算算法"

semantics:
  deterministic: true
  side_effects: ["none"]
  purity: "pure"
  concurrency:
    thread_safe: true
    reentrant: true
  security:
    sandbox_required: false
    data_sensitivity: "low"

examples:
  - name: "中文文本"
    input:
      text: "这是一个测试文本。"
      algorithm: "simple"
    output:
      token_count: 8
      estimated_count: 8.0
      char_count: 8
      algorithm: "simple"
  - name: "英文文本"
    input:
      text: "This is a test message."
      algorithm: "simple"
    output:
      token_count: 5
      estimated_count: 5.75
      char_count: 23
      algorithm: "simple"
  - name: "中英文混合"
    input:
      text: "Hello 世界！This is 测试。"
      algorithm: "simple"
    output:
      token_count: 10
      algorithm: "simple"

tests:
  framework: "builtin"
  cases:
    - name: "纯中文文本"
      input:
        text: "今天天气真好，我想去公园散步。"
        algorithm: "simple"
      expect:
        token_count: 14
        char_count: 14
        algorithm: "simple"
    - name: "纯英文文本"
      input:
        text: "The quick brown fox jumps over the lazy dog."
        algorithm: "simple"
      expect:
        token_count: 11
        char_count: 44
        algorithm: "simple"
    - name: "中英文混合"
      input:
        text: "Hello 世界！Welcome to 中国。"
        algorithm: "simple"
      expect:
        token_count: 11
        algorithm: "simple"
    - name: "使用 cl100k 算法"
      input:
        text: "Machine learning is amazing. 机器学习很棒。"
        algorithm: "cl100k"
      expect:
        algorithm: "cl100k"
    - name: "使用 gpt4 算法"
      input:
        text: "GPT-4 can process both English and 中文。"
        algorithm: "gpt4"
      expect:
        algorithm: "gpt4"
    - name: "空文本"
      input:
        text: ""
        algorithm: "simple"
      expect:
        token_count: 0
        char_count: 0
        algorithm: "simple"

tags: ["ai", "token", "nlp", "count", "estimation"]

quality:
  maturity: "stable"
  coverage: 0.95

provenance:
  created_at: "2026-02-06"
  updated_at: "2026-02-06"
  source:
    kind: "manual"
