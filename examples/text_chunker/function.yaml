spec_version: "0.1"

id: "ai.text_chunker"
version: "1.0.0"
name: "Text Chunker"
description: "将长文本分割成多个小块，支持按字符数、段落、句子等多种分块策略，适用于 RAG 和 Embedding 场景。"

license: "MIT"
authors:
  - name: "AIUtilsAgent_1.0"
    contact: "agent@example.com"

language:
  name: "python"
  runtime: "python>=3.8"

entrypoint:
  kind: "inline"
  symbol: "chunk_text"
  code: |
    import re
    from typing import List, Dict, Union
    
    def chunk_text(
        text: str,
        strategy: str = "char",
        chunk_size: int = 500,
        overlap: int = 50,
        separator: str = None
    ) -> Dict[str, Union[List[str], int, str]]:
        """
        将文本分割成多个块。
        
        Args:
            text: 输入文本
            strategy: 分块策略 (char/paragraph/sentence/word/token)
            chunk_size: 每个块的大小
            overlap: 块之间的重叠大小
            separator: 自定义分隔符（仅在 strategy=separator 时使用）
        
        Returns:
            包含 chunks, chunk_count, strategy 的字典
        """
        if not isinstance(text, str):
            raise ValueError("text must be a string")
        
        if not text.strip():
            return {
                "chunks": [],
                "chunk_count": 0,
                "total_length": 0,
                "strategy": strategy
            }
        
        chunks = []
        
        if strategy == "char":
            # 按字符数分块
            step = max(1, chunk_size - overlap)
            for i in range(0, len(text), step):
                chunk = text[i:i + chunk_size]
                if chunk.strip():
                    chunks.append(chunk)
        
        elif strategy == "paragraph":
            # 按段落分块
            # 支持多种段落分隔符
            paragraphs = re.split(r'\n\s*\n|\r\n\s*\r\n', text)
            paragraphs = [p.strip() for p in paragraphs if p.strip()]
            
            current_chunk = ""
            for para in paragraphs:
                if len(current_chunk) + len(para) + 1 <= chunk_size:
                    current_chunk = (current_chunk + "\n\n" + para).strip()
                else:
                    if current_chunk:
                        chunks.append(current_chunk)
                    current_chunk = para
            if current_chunk:
                chunks.append(current_chunk)
        
        elif strategy == "sentence":
            # 按句子分块
            # 支持中英文句子结束符
            sentence_pattern = r'(?<=[。．.！!？?])\s*'
            sentences = re.split(sentence_pattern, text)
            sentences = [s.strip() for s in sentences if s.strip()]
            
            current_chunk = ""
            for sent in sentences:
                if len(current_chunk) + len(sent) + 1 <= chunk_size:
                    current_chunk = (current_chunk + " " + sent).strip()
                else:
                    if current_chunk:
                        chunks.append(current_chunk)
                    current_chunk = sent
            if current_chunk:
                chunks.append(current_chunk)
        
        elif strategy == "word":
            # 按单词数分块
            words = text.split()
            step = max(1, chunk_size - overlap)
            for i in range(0, len(words), step):
                chunk_words = words[i:i + chunk_size]
                chunk = " ".join(chunk_words)
                if chunk.strip():
                    chunks.append(chunk)
        
        elif strategy == "separator":
            # 按自定义分隔符分块
            sep = separator if separator else "\n"
            parts = text.split(sep)
            parts = [p.strip() for p in parts if p.strip()]
            
            current_chunk = ""
            for part in parts:
                if len(current_chunk) + len(part) + len(sep) <= chunk_size:
                    current_chunk = (current_chunk + sep + part).strip()
                else:
                    if current_chunk:
                        chunks.append(current_chunk)
                    current_chunk = part
            if current_chunk:
                chunks.append(current_chunk)
        
        else:
            raise ValueError(f"Unknown strategy: {strategy}")
        
        return {
            "chunks": chunks,
            "chunk_count": len(chunks),
            "total_length": len(text),
            "strategy": strategy
        }

signature:
  inputs:
    text:
      type: "string"
      required: true
      description: "需要分块的文本"
      example: "这是一个很长的文本。需要被分割成多个小块。"
    strategy:
      type: "string"
      required: false
      default: "char"
      description: "分块策略 (char/paragraph/sentence/word/separator)"
      enum: ["char", "paragraph", "sentence", "word", "separator"]
    chunk_size:
      type: "integer"
      required: false
      default: 500
      description: "每个块的大小（字符数或单词数）"
    overlap:
      type: "integer"
      required: false
      default: 50
      description: "块之间的重叠大小（仅 char/word 策略有效）"
    separator:
      type: "string"
      required: false
      description: "自定义分隔符（仅在 strategy=separator 时使用）"
  outputs:
    chunks:
      type: "array"
      description: "分块后的文本数组"
      items:
        type: "string"
    chunk_count:
      type: "integer"
      description: "块的数量"
    total_length:
      type: "integer"
      description: "原始文本长度"
    strategy:
      type: "string"
      description: "使用的分块策略"
  errors:
    - code: "E_INVALID_TEXT"
      description: "输入文本不是字符串"
    - code: "E_UNKNOWN_STRATEGY"
      description: "未知的分块策略"

semantics:
  deterministic: true
  side_effects: ["none"]
  purity: "pure"
  concurrency:
    thread_safe: true
    reentrant: true
  security:
    sandbox_required: false
    data_sensitivity: "low"

examples:
  - name: "按字符分块"
    input:
      text: "这是一个测试文本。需要被分割成小块。"
      strategy: "char"
      chunk_size: 10
      overlap: 2
    output:
      chunks: ["这是一个测试文", "文本。需要被", "被分割成小块。"]
      chunk_count: 3
      strategy: "char"
  - name: "按段落分块"
    input:
      text: "第一段内容。\n\n第二段内容。\n\n第三段内容。"
      strategy: "paragraph"
      chunk_size: 100
    output:
      chunk_count: 3
      strategy: "paragraph"
  - name: "按句子分块"
    input:
      text: "这是第一句。这是第二句！这是第三句？"
      strategy: "sentence"
      chunk_size: 50
    output:
      chunk_count: 3
      strategy: "sentence"

tests:
  framework: "builtin"
  cases:
    - name: "按字符分块"
      input:
        text: "Hello World! This is a test message for chunking."
        strategy: "char"
        chunk_size: 20
        overlap: 5
      expect:
        chunk_count: 3
        strategy: "char"
    - name: "按段落分块"
      input:
        text: "第一段。\n\n第二段。\n\n第三段。"
        strategy: "paragraph"
        chunk_size: 100
      expect:
        chunk_count: 3
        strategy: "paragraph"
    - name: "按句子分块（中英文）"
      input:
        text: "这是第一句。This is second sentence! 这是第三句？"
        strategy: "sentence"
        chunk_size: 100
      expect:
        chunk_count: 3
        strategy: "sentence"
    - name: "按单词分块"
      input:
        text: "The quick brown fox jumps over the lazy dog"
        strategy: "word"
        chunk_size: 3
        overlap: 1
      expect:
        chunk_count: 4
        strategy: "word"
    - name: "自定义分隔符"
      input:
        text: "item1|item2|item3|item4"
        strategy: "separator"
        separator: "|"
        chunk_size: 100
      expect:
        chunk_count: 4
        strategy: "separator"
    - name: "空文本"
      input:
        text: ""
        strategy: "char"
        chunk_size: 100
      expect:
        chunk_count: 0
        chunks: []
    - name: "长段落自动分割"
      input:
        text: "这是一个很长的段落，超过了 chunk_size 的限制，需要被分割。"
        strategy: "paragraph"
        chunk_size: 20
      expect:
        chunk_count: 1
        strategy: "paragraph"

tags: ["ai", "text", "chunk", "split", "rag", "embedding"]

quality:
  maturity: "stable"
  coverage: 0.95

provenance:
  created_at: "2026-02-06"
  updated_at: "2026-02-06"
  source:
    kind: "manual"
