spec_version: '0.1'
id: 003.phone.validator
version: 1.0.0
name: 中国手机号验证器
description: 验证中国大陆手机号格式，支持三大运营商（移动、联通、电信）及虚拟运营商号码。
license: MIT
authors:
- name: ValidationAgent_1.0
  contact: ''
language:
  name: python
  runtime: python>=3.8
entrypoint:
  kind: inline
  symbol: validate_phone_cn
  code: "import re\nfrom typing import Tuple\n\ndef validate_phone_cn(phone: str, strict: bool = False)\
    \ -> Tuple[bool, str, str]:\n    \"\"\"\n    验证中国大陆手机号格式。\n    \"\"\"\n    # 清理输入\n    phone = str(phone).strip().replace('-',\
    \ '').replace(' ', '')\n    \n    # 基本格式检查\n    if not phone.isdigit():\n        return False, 'invalid',\
    \ ''\n    \n    # 长度检查\n    if len(phone) != 11:\n        return False, 'invalid', ''\n    \n    #\
    \ 必须以1开头\n    if not phone.startswith('1'):\n        return False, 'invalid', ''\n    \n    # 运营商号段\n\
    \    patterns = {\n        'mobile': r'^1(3[4-9]|4[7]|5[0-27-9]|7[8]|8[2-478])\\d{8}$',\n        'unicom':\
    \ r'^1(3[0-2]|4[5]|5[56]|6[6]|7[56]|8[56]|9[6])\\d{8}$',\n        'telecom': r'^1(33|49|53|7[37]|8[019]|9[0139])\\\
    d{8}$',\n        'virtual': r'^17[01]\\d{8}$'\n    }\n    \n    for carrier, pattern in patterns.items():\n\
    \        if re.match(pattern, phone):\n            formatted = f'{phone[:3]}-{phone[3:7]}-{phone[7:]}'\n\
    \            return True, carrier, formatted\n    \n    # 非严格模式下接受所有 1 开头的 11 位数字\n    if not strict:\n\
    \        formatted = f'{phone[:3]}-{phone[3:7]}-{phone[7:]}'\n        return True, 'unknown', formatted\n\
    \    \n    return False, 'invalid', ''"
signature:
  inputs:
    phone:
      type: str
      required: true
      description: 待验证的手机号
    strict:
      type: bool
      required: false
      description: 是否严格验证号段
      default: false
  outputs:
    is_valid:
      type: bool
      description: 是否为有效手机号
    carrier:
      type: str
      description: 运营商（mobile/unicom/telecom/virtual/unknown）
    formatted:
      type: str
      description: 格式化后的手机号（如 138-1234-5678）
semantics:
  deterministic: true
  side_effects:
  - none
  security:
    sandbox_required: false
    data_sensitivity: low
tests:
  framework: builtin
  cases:
  - name: mobile_138
    input:
      phone: '13812345678'
      strict: false
    expect:
      is_valid: true
      carrier: mobile
      formatted: 138-1234-5678
  - name: unicom_186
    input:
      phone: '18612345678'
      strict: false
    expect:
      is_valid: true
      carrier: unicom
      formatted: 186-1234-5678
  - name: telecom_189
    input:
      phone: '18912345678'
      strict: false
    expect:
      is_valid: true
      carrier: telecom
      formatted: 189-1234-5678
  - name: with_hyphen
    input:
      phone: 138-1234-5678
      strict: false
    expect:
      is_valid: true
      carrier: mobile
      formatted: 138-1234-5678
  - name: too_short
    input:
      phone: '138123'
      strict: false
    expect:
      is_valid: false
      carrier: invalid
      formatted: ''
  - name: invalid_chars
    input:
      phone: 1381234abcd
      strict: false
    expect:
      is_valid: false
      carrier: invalid
      formatted: ''
tags:
- phone
- validation
- china
- mobile
quality:
  maturity: stable
provenance:
  created_at: '2026-02-01T08:30:00Z'
  updated_at: '2026-02-01T08:30:00Z'
  source:
    kind: manual
