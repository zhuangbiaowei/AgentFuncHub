spec_version: "0.1"

id: "list.deduplicate"
version: "1.0.0"
name: "List Deduplicator"
description: "Remove duplicate elements from a list with options to preserve order and use custom keys for deduplication."

license: "MIT"
authors:
  - name: "DataAgent_1.0"
    contact: "agent@example.com"

language:
  name: "python"
  runtime: "python>=3.8"

entrypoint:
  kind: "inline"
  symbol: "deduplicate_list"
  code: |
    from typing import List, Tuple, Any, Optional
    
    def deduplicate_list(
        items: List[Any],
        preserve_order: bool = True,
        key: Optional[str] = None
    ) -> Tuple[List[Any], int, int]:
        if not items:
            return [], 0, 0
        
        original_count = len(items)
        seen = set()
        unique_items = []
        
        for item in items:
            if key and isinstance(item, dict):
                compare_key = item.get(key)
            else:
                compare_key = item
            
            try:
                hash(compare_key)
            except TypeError:
                compare_key = str(compare_key)
            
            if compare_key not in seen:
                seen.add(compare_key)
                unique_items.append(item)
        
        removed_count = original_count - len(unique_items)
        
        if not preserve_order:
            try:
                unique_items = list(set(items))
            except TypeError:
                pass
        
        return unique_items, removed_count, original_count

signature:
  inputs:
    items:
      type: "array"
      required: true
      description: "Input list to deduplicate"
    preserve_order:
      type: "boolean"
      required: false
      default: true
      description: "Whether to preserve original order"
    key:
      type: "string"
      required: false
      description: "Key field for deduplicating dict lists"
  outputs:
    unique_items:
      type: "array"
      description: "Deduplicated list"
    removed_count:
      type: "integer"
      description: "Number of removed duplicates"
    original_count:
      type: "integer"
      description: "Original list length"

semantics:
  deterministic: true
  side_effects: ["none"]
  purity: "pure"
  concurrency:
    thread_safe: true
    reentrant: true
  security:
    sandbox_required: false
    network_access: false
    data_sensitivity: "low"

dependencies:
  system: []
  packages: []

examples:
  - name: "basic dedup"
    input:
      items: [1, 2, 2, 3, 3, 3]
      preserve_order: true
    output:
      unique_items: [1, 2, 3]
      removed_count: 3
      original_count: 6
  - name: "dict list with key"
    input:
      items: [{"id": 1, "name": "A"}, {"id": 2, "name": "B"}, {"id": 1, "name": "C"}]
      key: "id"
    output:
      unique_items: [{"id": 1, "name": "A"}, {"id": 2, "name": "B"}]
      removed_count: 1

tests:
  framework: "builtin"
  cases:
    - name: "basic dedup"
      input:
        items: [1, 2, 2, 3, 3, 3]
        preserve_order: true
      expect:
        unique_items: [1, 2, 3]
        removed_count: 3
        original_count: 6
    - name: "preserve order"
      input:
        items: [3, 1, 2, 1, 3]
        preserve_order: true
      expect:
        unique_items: [3, 1, 2]
    - name: "dict list with key"
      input:
        items: [{"id": 1, "name": "A"}, {"id": 2, "name": "B"}, {"id": 1, "name": "C"}]
        key: "id"
      expect:
        unique_items: [{"id": 1, "name": "A"}, {"id": 2, "name": "B"}]
        removed_count: 1
    - name: "empty list"
      input:
        items: []
      expect:
        unique_items: []
        removed_count: 0
        original_count: 0
    - name: "all unique"
      input:
        items: [1, 2, 3, 4]
      expect:
        unique_items: [1, 2, 3, 4]
        removed_count: 0

tags: ["list", "deduplicate", "unique", "filter", "data"]

quality:
  maturity: "stable"
  coverage: 0.9

provenance:
  created_at: "2026-02-01"
  updated_at: "2026-02-01"
  source:
    kind: "manual"
