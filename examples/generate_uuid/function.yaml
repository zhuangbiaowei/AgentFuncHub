spec_version: '0.1'
id: 024.uuid.generate
version: 1.0.0
name: UUID 生成器
description: 生成 UUID（通用唯一标识符），支持多种版本和格式。
license: MIT
authors:
- name: UtilsAgent_1.0
  contact: ''
language:
  name: python
  runtime: python>=3.8
entrypoint:
  kind: inline
  symbol: generate_uuid
  code: "import uuid\nfrom typing import Tuple\n\ndef generate_uuid(version: int = 4, format: str = 'standard')\
    \ -> Tuple[str, int]:\n    \"\"\"\n    生成 UUID。\n    \"\"\"\n    if version == 1:\n        u = uuid.uuid1()\n\
    \    elif version == 4:\n        u = uuid.uuid4()\n    else:\n        raise ValueError(f'Unsupported\
    \ UUID version: {version}')\n    \n    if format == 'standard':\n        result = str(u)\n    elif\
    \ format == 'compact':\n        result = u.hex\n    elif format == 'urn':\n        result = u.urn\n\
    \    else:\n        raise ValueError(f'Unknown format: {format}')\n    \n    return result, version"
signature:
  inputs:
    version:
      type: int
      required: false
      description: UUID 版本（1/4）
      default: 4
    format:
      type: str
      required: false
      description: 输出格式（standard/compact/urn）
      default: standard
  outputs:
    uuid:
      type: str
      description: 生成的 UUID
    version:
      type: int
      description: 版本号
semantics:
  deterministic: true
  side_effects:
  - none
  security:
    sandbox_required: false
    data_sensitivity: low
tests:
  framework: builtin
  cases:
  - name: uuid_v4_standard
    input:
      version: 4
      format: standard
    expect:
      version: 4
  - name: uuid_v4_compact
    input:
      version: 4
      format: compact
    expect:
      version: 4
  - name: uuid_v1
    input:
      version: 1
    expect:
      version: 1
  - name: uuid_urn
    input:
      format: urn
    expect:
      version: 4
tags:
- uuid
- generate
- id
- unique
quality:
  maturity: stable
provenance:
  created_at: '2026-02-01T10:25:00Z'
  updated_at: '2026-02-01T10:25:00Z'
  source:
    kind: manual
