spec_version: "0.1"

id: "utils.memoize"
version: "1.0.0"
name: "Memoize"
description: "函数记忆化装饰器，缓存函数结果以提高性能，支持 TTL 和最大缓存条目数"

language:
  name: "python"
  runtime: "python>=3.8"

entrypoint:
  kind: "inline"
  symbol: "memoize_call"
  code: |
    import time
    import hashlib
    import json
    from typing import Dict, Any, List, Optional, Callable
    
    # 全局缓存存储
    _memo_cache = {}
    
    def memoize_call(
        func_code: str,
        func_name: str = "target_function",
        args: Optional[List] = None,
        kwargs: Optional[Dict] = None,
        ttl: Optional[int] = None,
        max_entries: int = 1000,
        cache_key: Optional[str] = None,
        invalidate: bool = False
    ) -> Dict[str, Any]:
        """
        带记忆化的函数调用
        
        Args:
            func_code: 函数代码字符串
            func_name: 函数名
            args: 位置参数
            kwargs: 关键字参数
            ttl: 缓存生存时间(秒)
            max_entries: 最大缓存条目数
            cache_key: 自定义缓存键
            invalidate: 是否使缓存失效
            
        Returns:
            包含结果和缓存状态的字典
        """
        global _memo_cache
        
        if args is None:
            args = []
        if kwargs is None:
            kwargs = {}
        
        # 编译函数
        try:
            namespace = {}
            exec(func_code, namespace)
            target_func = namespace.get(func_name)
            
            if target_func is None:
                return {
                    "success": False,
                    "error": f"Function '{func_name}' not found",
                    "cached": False
                }
        except Exception as e:
            return {
                "success": False,
                "error": f"Failed to compile: {str(e)}",
                "cached": False
            }
        
        # 生成缓存键
        if cache_key:
            key = cache_key
        else:
            # 基于函数名和参数生成键
            key_data = {
                "func": func_name,
                "args": args,
                "kwargs": kwargs
            }
            key = hashlib.md5(
                json.dumps(key_data, sort_keys=True).encode()
            ).hexdigest()
        
        # 检查缓存
        current_time = time.time()
        
        if invalidate and key in _memo_cache:
            del _memo_cache[key]
            return {
                "success": True,
                "invalidated": True,
                "key": key
            }
        
        if key in _memo_cache:
            cached_data = _memo_cache[key]
            
            # 检查 TTL
            if ttl and cached_data.get("timestamp"):
                if current_time - cached_data["timestamp"] > ttl:
                    # 缓存过期，删除并重新计算
                    del _memo_cache[key]
                else:
                    return {
                        "success": True,
                        "result": cached_data["result"],
                        "cached": True,
                        "key": key,
                        "age": int(current_time - cached_data["timestamp"])
                    }
            else:
                return {
                    "success": True,
                    "result": cached_data["result"],
                    "cached": True,
                    "key": key
                }
        
        # 执行函数
        try:
            result = target_func(*args, **kwargs)
            
            # 保存到缓存
            # LRU: 如果超出限制，删除最旧的条目
            if len(_memo_cache) >= max_entries:
                oldest_key = min(
                    _memo_cache.keys(),
                    key=lambda k: _memo_cache[k].get("timestamp", 0)
                )
                del _memo_cache[oldest_key]
            
            _memo_cache[key] = {
                "result": result,
                "timestamp": current_time,
                "func_name": func_name
            }
            
            return {
                "success": True,
                "result": result,
                "cached": False,
                "key": key,
                "cache_size": len(_memo_cache)
            }
            
        except Exception as e:
            return {
                "success": False,
                "error": str(e),
                "cached": False
            }
    
    def clear_memo_cache(pattern: Optional[str] = None) -> Dict[str, Any]:
        """清除记忆化缓存"""
        global _memo_cache
        
        if pattern:
            keys_to_remove = [
                k for k in _memo_cache.keys()
                if pattern in k or pattern in _memo_cache[k].get("func_name", "")
            ]
            for k in keys_to_remove:
                del _memo_cache[k]
            return {"cleared": len(keys_to_remove)}
        else:
            count = len(_memo_cache)
            _memo_cache.clear()
            return {"cleared": count}

signature:
  inputs:
    func_code:
      type: "string"
      required: true
      description: "函数代码字符串"
      example: "def fibonacci(n):\n    if n <= 1:\n        return n\n    return fibonacci(n-1) + fibonacci(n-2)"
    func_name:
      type: "string"
      required: false
      description: "函数名"
      default: "target_function"
      example: "fibonacci"
    args:
      type: "array"
      required: false
      description: "位置参数"
      default: []
      example: [10]
    kwargs:
      type: "object"
      required: false
      description: "关键字参数"
      default: {}
      example: {}
    ttl:
      type: "integer"
      required: false
      description: "缓存生存时间(秒)"
      default: null
      example: 300
    max_entries:
      type: "integer"
      required: false
      description: "最大缓存条目数"
      default: 1000
      example: 1000
    cache_key:
      type: "string"
      required: false
      description: "自定义缓存键"
      default: null
      example: "my_cache_key"
    invalidate:
      type: "boolean"
      required: false
      description: "是否使缓存失效"
      default: false
      example: false
  outputs:
    success:
      type: "boolean"
      description: "是否成功"
    result:
      type: "any"
      required: false
      description: "函数结果"
    cached:
      type: "boolean"
      description: "是否来自缓存"
    key:
      type: "string"
      required: false
      description: "缓存键"
    cache_size:
      type: "integer"
      required: false
      description: "当前缓存大小"
    age:
      type: "integer"
      required: false
      description: "缓存年龄(秒)"
    invalidated:
      type: "boolean"
      required: false
      description: "是否已失效"
    error:
      type: "string"
      required: false
      description: "错误信息"

semantics:
  deterministic: false
  side_effects: ["memory"]
  purity: "impure"
  security:
    sandbox_required: true
    network_access: false
    data_sensitivity: "low"

tests:
  framework: "builtin"
  cases:
    - name: "首次调用（未缓存）"
      input:
        func_code: "def add(a, b):\n    return a + b"
        func_name: "add"
        args: [1, 2]
      expect:
        success: true
        result: 3
        cached: false
    - name: "带 TTL 的缓存"
      input:
        func_code: "def compute(x):\n    return x * 2"
        func_name: "compute"
        args: [5]
        ttl: 60
      expect:
        success: true
        cached: false
    - name: "自定义缓存键"
      input:
        func_code: "def test():\n    return 'hello'"
        cache_key: "my_key"
      expect:
        success: true
        cached: false
        key: "my_key"
    - name: "使缓存失效"
      input:
        func_code: "def test():\n    return 'hello'"
        cache_key: "test_key"
        invalidate: true
      expect:
        success: true
        invalidated: true

tags: ["utils", "memoize", "cache", "performance"]

quality:
  maturity: "stable"
  coverage: 0.9

metadata:
  author: "AgentFuncHub"
  license: "MIT"
