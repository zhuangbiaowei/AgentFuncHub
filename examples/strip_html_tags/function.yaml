spec_version: '0.1'
id: 011.html.strip
version: 1.0.0
name: HTML 标签剥离器
description: 移除 HTML 标签，提取纯文本内容，支持保留换行格式。
license: MIT
authors:
- name: TextAgent_1.0
  contact: ''
language:
  name: python
  runtime: python>=3.8
entrypoint:
  kind: inline
  symbol: strip_html_tags
  code: "import re\nfrom typing import Tuple\n\ndef strip_html_tags(\n    html: str, \n    keep_line_breaks:\
    \ bool = True,\n    trim_whitespace: bool = True\n) -> Tuple[str, int, int]:\n    \"\"\"\n    移除 HTML\
    \ 标签，提取纯文本。\n    \"\"\"\n    if not html:\n        return '', 0, 0\n    \n    original_length = len(html)\n\
    \    text = html\n    \n    # 保留换行格式\n    if keep_line_breaks:\n        # 将块级元素替换为换行\n        block_tags\
    \ = ['br', 'p', 'div', 'h[1-6]', 'li', 'tr']\n        for tag in block_tags:\n            text = re.sub(f'</?{tag}[^>]*>',\
    \ '\\n', text, flags=re.IGNORECASE)\n    \n    # 移除所有 HTML 标签\n    text = re.sub(r'<[^>]+?>', '',\
    \ text)\n    \n    # 解码 HTML 实体\n    import html\n    text = html.unescape(text)\n    \n    # 修剪空白\n\
    \    if trim_whitespace:\n        # 合并多个换行\n        text = re.sub(r'\\n+', '\\n', text)\n        #\
    \ 合并多个空格\n        text = re.sub(r' +', ' ', text)\n        # 去除首尾空白\n        text = text.strip()\n\
    \    \n    return text, original_length, len(text)"
signature:
  inputs:
    html:
      type: str
      required: true
      description: HTML 字符串
    keep_line_breaks:
      type: bool
      required: false
      description: 是否保留换行格式（将<br>, <p> 等转为换行）
      default: true
    trim_whitespace:
      type: bool
      required: false
      description: 是否修剪多余空白
      default: true
  outputs:
    text:
      type: str
      description: 纯文本内容
    original_length:
      type: int
      description: 原始 HTML 长度
    text_length:
      type: int
      description: 提取后文本长度
semantics:
  deterministic: true
  side_effects:
  - none
  security:
    sandbox_required: false
    data_sensitivity: low
tests:
  framework: builtin
  cases:
  - name: simple_html
    input:
      html: <p>Hello <strong>World</strong>!</p>
      keep_line_breaks: true
      trim_whitespace: true
    expect:
      text: Hello World!
      original_length: 43
      text_length: 12
  - name: with_line_breaks
    input:
      html: <p>Line 1</p><p>Line 2</p>
      keep_line_breaks: true
      trim_whitespace: true
    expect:
      text: Line 1\nLine 2
  - name: html_entities
    input:
      html: '&lt;div&gt;Test&lt;/div&gt;'
      keep_line_breaks: false
      trim_whitespace: true
    expect:
      text: <div>Test</div>
  - name: empty_html
    input:
      html: ''
      keep_line_breaks: true
      trim_whitespace: true
    expect:
      text: ''
      original_length: 0
      text_length: 0
  - name: no_html
    input:
      html: Just plain text
      keep_line_breaks: true
      trim_whitespace: true
    expect:
      text: Just plain text
tags:
- html
- text
- strip
- clean
quality:
  maturity: stable
provenance:
  created_at: '2026-02-01T09:20:00Z'
  updated_at: '2026-02-01T09:20:00Z'
  source:
    kind: manual
